name: Tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip

      - name: Install exact tested dependencies
        run: >-
          python -m pip install --disable-pip-version-check
          --constraint requirements-dev.lock --editable ".[dev]"

      - name: Lint
        run: ruff check .

      - name: Test helper and notebooks
        run: pytest
